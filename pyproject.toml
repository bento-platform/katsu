[build-system]
requires = ["uv_build>=0.10.10,<0.11.0"]
build-backend = "uv_build"

[project]
name = "chord_metadata_service"
version = "13.1.0"
description = "An implementation of a clin/pheno metadata store for the Bento platform."
authors = [
    { name = "Ksenia Zaytseva" },
    { name = "David Lougheed", email = "david.lougheed@mail.mcgill.ca" },
    { name = "Simon Chénard", email = "simon.chenard2@mcgill.ca" },
    { name = "Romaine Grégoire" },
    { name = "Paul Pillot", email = "paul.pillot@computationalgenomics.ca" },
    { name = "Son Chau" },
]
requires-python = ">=3.12.0,<4"
readme = "README.md"
license = "LGPL-3.0-only"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU Lesser General Public License v3 (LGPLv3)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "bento-lib[django]",
    "Django~=5.2.9",
    "django-autocomplete-light>=3.12.1,<4",
    "django-cors-headers>=4.9.0,<5",
    "django-filter>=25.2,<25.3",
    "djangorestframework~=3.16.1",
    "djangorestframework-camel-case>=1.4.1,<2",
    "drf-spectacular>=0.29.0,<0.30",
    "jsonschema[format]~=4.26.0",
    "psycopg2-binary~=2.9.11",
    "PyJWT[crypto]>=2.10.1,<3",
    "python-dateutil>=2.9.0.post0,<3",
    "python-dotenv>=1.1.1,<2",
    "rdflib>=6.3.2,<7",
    "requests>=2.32.5,<3",
    "rfc3987>=1.3.8,<2",
    "tabulate>=0.9.0,<0.10",
    "uritemplate>=4.2.0,<5",
    "pyhumps>=3.8.0,<4",
    "adrf>=0.1.12,<0.2",
    "referencing>=0.37.0,<0.38",
    "django-structlog>=10.0.0,<11",
    "pycountry>=24.6.1,<25",
    "structlog>=25.4.0,<26",
    "pydantic>=2.12.3,<3",
]

[project.urls]
Repository = "https://github.com/bento-platform/katsu"

[dependency-groups]
dev = [
    "coverage>=7.11.0,<8",
    "flake8>=7.3.0,<8",
    "ruff>=0.15.0,<0.16",
    "tox>=4.31.0,<5",
    "debugpy>=1.8.17,<2",
    "daphne>=4.2.1,<5",
    "aioresponses>=0.7.8,<0.8",
]

[tool.uv]
default-groups = "all"

[tool.uv.sources]
bento-lib = { git = "https://github.com/bento-platform/bento_lib.git", rev = "feature/dataset-model" }

[tool.uv.build-backend]
module-name = ["chord_metadata_service"]
module-root = ""
source-include = [
    "chord_metadata_service/chord/workflows/wdls/*.wdl",
    "chord_metadata_service/chord/tests/*.json",
    "chord_metadata_service/dats/*",
    "chord_metadata_service/restapi/tests/*.json",
]

[tool.ruff]
line-length = 120
extend-exclude = ["chord_metadata_service/*/migrations"]
