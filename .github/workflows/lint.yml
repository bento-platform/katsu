name: Lint
on:
  push:
    branches:
      - master
      - develop
  pull_request:
    branches:
      - develop
      - master

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        name: Set up Python
        with:
          python-version: '3.12'
      - name: Install ruff
        run: python -m pip install ruff
      - name: Run linter
        run: ruff check ./chord_metadata_service/mohpackets
